## Правила реализации

### Язык и стиль
- Java 8: без `var`, `record`, `List.of`, switch-выражений
- Поля `private` (и `final`, где можно), зависимости через конструктор, интерфейсы на границах domain
- Логика игры — в `domain/` или сервисах; блок, предмет, TileEntity делегируют ей
- Константы вместо чисел; `@Nullable`/`@Nonnull` на публичном API; `ItemStack.EMPTY` вместо `null`
- Логгер мода вместо `System.out`; исключения не глотать

### Регистрация
```java
@Mod.EventBusSubscriber(modid = ModConstants.MOD_ID)
public final class ModBlocks {
    @GameRegistry.ObjectHolder(ModConstants.MOD_ID + ":copper_ore")
    public static final Block COPPER_ORE = null;

    private ModBlocks() {
    }

    @SubscribeEvent
    public static void registerBlocks(RegistryEvent.Register<Block> event) {
        event.getRegistry().register(new BlockCopperOre()
            .setRegistryName(ModConstants.MOD_ID, "copper_ore")
            .setUnlocalizedName(ModConstants.MOD_ID + ".copper_ore")
            .setCreativeTab(CreativeTabs.BUILDING_BLOCKS));
    }
}
```
- Имена методов зависят от маппингов в `build.gradle`: в MDK (`snapshot_20171003-1.12`) — `setUnlocalizedName`, в `stable_39` — `setTranslationKey`. Бери то, что уже используется в проекте
- Модели предметов — в клиентском `@Mod.EventBusSubscriber(value = Side.CLIENT)` по `ModelRegistryEvent` (`ModelLoader.setCustomModelResourceLocation`), не в конструкторе и не через `IHasModel`

### Сеть
```java
public final class SetModeMessage implements IMessage {
    private static final int MODE_COUNT = Mode.values().length;
    private BlockPos pos = BlockPos.ORIGIN;
    private int mode;

    public SetModeMessage() {
    }

    public SetModeMessage(BlockPos pos, Mode mode) {
        this.pos = pos;
        this.mode = mode.ordinal();
    }

    @Override
    public void fromBytes(ByteBuf buf) {
        pos = BlockPos.fromLong(buf.readLong());
        mode = buf.readInt();
    }

    @Override
    public void toBytes(ByteBuf buf) {
        buf.writeLong(pos.toLong());
        buf.writeInt(mode);
    }

    public static final class Handler implements IMessageHandler<SetModeMessage, IMessage> {
        private static final double MAX_REACH_SQ = 64.0;

        @Override
        public IMessage onMessage(SetModeMessage message, MessageContext ctx) {
            EntityPlayerMP player = ctx.getServerHandler().player;
            player.getServerWorld().addScheduledTask(() -> apply(message, player));
            return null;
        }

        private static void apply(SetModeMessage message, EntityPlayerMP player) {
            World world = player.world;
            if (message.mode < 0 || message.mode >= MODE_COUNT) {
                return;
            }
            if (!world.isBlockLoaded(message.pos) || player.getDistanceSq(message.pos) > MAX_REACH_SQ) {
                return;
            }
            TileEntity tile = world.getTileEntity(message.pos);
            if (tile instanceof TileEntityGrinder) {
                ((TileEntityGrinder) tile).setMode(Mode.values()[message.mode]);
            }
        }
    }
}
```
- Каждое поле с клиента проверяется на сервере: границы, дистанция, загруженность, права, открытый `Container`
- Строки и списки из `ByteBuf` — с лимитом длины (константа)

### TileEntity и NBT
- `readFromNBT`: `hasKey(key, Constants.NBT.TAG_…)` и значение по умолчанию; новые ключи не ломают старые миры
- `markDirty()` после изменения; синхронизация с клиентом через `getUpdatePacket`/`onDataPacket` и `world.notifyBlockUpdate` — только при изменении
- `ITickable#update`: ранний выход `if (world.isRemote) return;` для серверной логики, тяжёлая работа раз в N тиков

### Клиент
- `net.minecraft.client.*` — только в `client/`, `ClientProxy` и клиентских подписчиках
- GUI открывается через `player.openGui` и `IGuiHandler`, логика контейнера — в `Container`, не в `GuiScreen`

### Ресурсы
- Ресурсы, которые нужны коду (blockstate, модель, текстура, звук), ты не рисуешь и не придумываешь: перечисли их в ASSETS_NEEDED
- Ключи перевода добавь в `assets/<modid>/lang/en_us.lang` (и `ru_ru.lang`, если он есть в проекте)

### Проверка
- После правок запусти `lint` профиля из `.aikit/profiles.json` в папке `root` (по умолчанию — компиляция и Checkstyle, если он подключён); ошибки компиляции и Checkstyle в своих файлах исправь до ответа, правила в `config/checkstyle/checkstyle.xml` не ослабляй
- Первая сборка готовит декомпилированный Minecraft и идёт дольше — это нормально; Gradle падает до компиляции — проверь JDK 8 (`JAVA_HOME`) и напиши об этом в LINT


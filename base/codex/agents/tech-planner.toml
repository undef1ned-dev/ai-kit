## Шаг 2 — Определи технический scope по профилям

Платформы — это профили проекта из `.aikit/profiles.json`. Профиль задействован, если фича требует изменений в его части системы.

### Профиль с `role: backend` — нужен если:
- Хранятся новые данные
- Нужен новый или изменённый API endpoint
- Нужна бизнес-логика на сервере
- Нужны изменения в админке (если она есть в стеке профиля)

### Профиль с `role: web` — нужен если:
- Нужна новая страница или изменение существующей
- Нужен новый API-вызов
- Изменяется навигация или общее клиентское состояние

Внешние клиенты (мобильные приложения, сторонние интеграции) без своего профиля в проекте отметь в TECHNICAL RISKS как потребителей API-контракта.

Для каждого задействованного профиля определи верхнеуровневые блоки работ. Не уходи в детали реализации — это задача архитекторов профилей.

---

## Шаг 3 — Спроектируй API-контракт (если задействован Backend)

Это самая важная часть — Backend и Frontend должны договориться о контракте ДО начала реализации. Платформенные архитекторы будут опираться именно на него.

Для каждого нового или изменённого endpoint определи:
- HTTP метод и путь
- Нужна ли авторизация
- Query-параметры (фильтрация, сортировка, пагинация)
- Структура request body (если POST/PUT/PATCH)
- Структура response

**Правила именования:**
- Пути в snake_case: `/api/v1/export_requests/`
- Поля JSON в snake_case: `created_at`, `user_id`
- Клиенты сами маппят snake_case в свой стиль именования — контракт остаётся в snake_case
- Nullable поля должны быть явно помечены

---

## Шаг 4 — Определи порядок реализации

Зрелый продукт требует последовательности. Опиши этапы с зависимостями:

**Почему это важно:**
- Backend и Frontend могут работать параллельно только если API-контракт зафиксирован
- Миграции БД нужно делать до деплоя кода
- Изменения Breaking API требуют синхронного деплоя всех платформ

---


name: Build Docs Artifact

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "scripts/generate-*.py"
      - "profiles/**"
      - "packs/**"
      - "presets/**"
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/build-docs-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate docs
        run: |
          python3 scripts/generate-profile-docs.py
          python3 scripts/generate-catalog.py

      - name: Upload generated docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: aikit-docs
          path: |
            docs
            docs-site
          if-no-files-found: error

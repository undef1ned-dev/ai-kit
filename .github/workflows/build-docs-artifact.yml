name: Build Catalog Artifact

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "scripts/generate-catalog.py"
      - "scripts/expand-template.py"
      - "base/**"
      - "profiles/**"
      - "packs/**"
      - "presets/**"
      - ".github/workflows/build-docs-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate catalog
        run: python3 scripts/generate-catalog.py

      - name: Upload generated docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: aikit-catalog
          path: docs/generated/catalog.html
          if-no-files-found: error

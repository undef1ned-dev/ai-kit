name: Version

# After a merge into main: scripts/bump-version.py picks major, minor or patch from the Conventional Commits
# of the merge (no model is called), writes VERSION and a CHANGELOG.md section, the plugin manifests and the
# site are rebuilt, and github-actions[bot] commits "chore(release): vX.Y.Z". Claude Code and Codex update
# installed plugins when "version" in their manifests changes.
#
# How the commit reaches main (the ruleset of main requires green CI, so a plain bot push is rejected):
#   secret RELEASE_DEPLOY_KEY set — pushed straight to main with a deploy key that the ruleset lets bypass;
#   no secret                     — pushed to release/vX.Y.Z, a PR with auto-merge is opened and CI is
#                                   started on it (workflow_dispatch: pushes and PRs made with GITHUB_TOKEN
#                                   do not start workflows). Needs "Allow GitHub Actions to create and
#                                   approve pull requests" in the repository settings.
on:
  push:
    branches:
      - main
    # Mirrors PLUGIN_PATHS in scripts/bump-version.py (checked by scripts/ci/test-bump-version.py):
    # a merge of docs, evals or CI alone does not start the job
    paths:
      - "base/**"
      - "profiles/**"
      - "packs/**"
      - "presets/**"
      - "templates/**"
      - "adapters/**"
      - "hooks/**"
      - "deck/**"
      - "scripts/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".antigravity-plugin/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  bump:
    # The release commit itself must not start another bump
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bump version
        id: bump
        run: python3 scripts/bump-version.py --write

      - name: Rebuild plugin manifests and site
        if: steps.bump.outputs.version != ''
        run: |
          python3 scripts/build-plugins.py
          python3 scripts/generate-docs.py

      - name: Commit release
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v$VERSION"
          if [[ -n "$DEPLOY_KEY" ]]; then
            git push origin HEAD:main
            exit 0
          fi
          branch="release/v$VERSION"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "chore(release): v$VERSION" \
            --body "Версия $VERSION: VERSION, CHANGELOG.md, манифесты плагинов и сайт. Собрано scripts/bump-version.py после слияния в main."
          gh pr merge "$branch" --auto --squash
          gh workflow run ci.yml --ref "$branch"

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Two jobs on purpose: Actions minutes are billed per job (rounded up), Windows minutes count double.
# Each step loops over all presets and keeps going after a failure, so one run shows every broken preset.
jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Provide python3 on Windows
        if: runner.os == 'Windows'
        run: |
          command -v python3 >/dev/null || cp "$(command -v python)" "$(dirname "$(command -v python)")/python3.exe"
          python3 --version

      - name: Static checks
        if: runner.os == 'Linux'
        run: bash scripts/ci/static-checks.sh

      - name: Smoke attach.sh (Claude Code)
        run: |
          status=0
          for preset in presets/*.json; do
            bash scripts/ci/smoke-attach.sh "$(basename "$preset" .json)" "$RUNNER_TEMP/attach" || status=1
          done
          exit $status

      - name: Smoke adapters (Codex, OpenCode)
        if: success() || failure()
        run: |
          status=0
          for adapter in codex opencode; do
            for preset in presets/*.json; do
              bash scripts/ci/smoke-adapter.sh "$adapter" "$(basename "$preset" .json)" "$RUNNER_TEMP/adapters" || status=1
            done
          done
          exit $status

      - name: Smoke new profile from template
        if: success() || failure()
        run: bash scripts/ci/smoke-new-profile.sh "$RUNNER_TEMP/new-profile"

      # settings.json merge fallback when jq is not installed
      - name: Smoke attach.sh without jq
        if: runner.os == 'Linux' && (success() || failure())
        run: |
          sudo rm -f "$(command -v jq)"
          ! command -v jq
          bash scripts/ci/smoke-attach.sh fullstack-web "$RUNNER_TEMP/no-jq"
